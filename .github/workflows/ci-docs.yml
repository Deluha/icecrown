# Build the documentation site with warnings as errors. Sphinx needs Python 3.13 or newer.
name: ci-docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_NO_PROGRESS: "1"

jobs:
  docs:
    name: docs build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the package and the docs group
        run: uv sync --frozen --group docs
      - name: Build, failing on any warning
        run: uv run --frozen sphinx-build -W --keep-going -n -b html docs docs/_build/html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: docs-html
          path: docs/_build/html/
          retention-days: 7
