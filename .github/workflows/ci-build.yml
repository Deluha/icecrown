# Build the sdist and the wheel once, check their metadata, and run the tests against the wheel.
name: ci-build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  UV_NO_PROGRESS: "1"

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          python-version: "3.15"
      - name: Build the sdist and the wheel
        run: uv build
      - name: Check the distribution metadata
        run: uvx twine@7.0.0 check --strict dist/*
      - name: List the contents
        run: |
          tar tzf dist/*.tar.gz
          unzip -l dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  wheel-tests:
    name: tests against the wheel (${{ matrix.python }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Install the wheel and the test group into a fresh environment
        run: |
          uv venv .wheel-venv
          uv pip install --python .wheel-venv dist/*.whl
          uv pip install --python .wheel-venv --group test
      - name: Check that the package is imported from the wheel
        run: .wheel-venv/bin/python -c "import icecrown, sys; assert 'site-packages' in icecrown.__file__, icecrown.__file__; print(icecrown.__file__)"
      - name: Run the tests
        env:
          HYPOTHESIS_PROFILE: ci
        run: .wheel-venv/bin/python -m pytest
