# Hooks that run on every commit. Python tools run from the locked environment (uv run --frozen),
# so their versions come from uv.lock and never drift from CI. Third-party hook repositories are
# pinned to a commit hash.
minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: mypy (strict)
        entry: uv run --frozen mypy
        language: system
        types_or: [python, pyi, toml]
        pass_filenames: false
        require_serial: true
      - id: actionlint
        name: actionlint
        entry: uv run --frozen actionlint
        language: system
        files: ^\.github/workflows/
        pass_filenames: false
      - id: zizmor
        name: zizmor (workflow security, offline audits)
        entry: uv run --frozen zizmor --offline --min-severity low .github/workflows
        language: system
        files: ^(\.github/|zizmor\.yml$)
        pass_filenames: false
      - id: check-conventions
        name: check conventions (C1-C7)
        entry: uv run --frozen python tools/check_conventions.py
        language: system
        files: ^(src/|tools/|tests/|pyproject\.toml$)
        pass_filenames: false
      - id: check-guidance-integrity
        name: check guidance integrity (G1-G7)
        entry: uv run --frozen python tools/check_guidance_integrity.py
        language: system
        files: (\.md$|^\.claude/|^evals/)
        pass_filenames: false
      - id: check-docs-sync
        name: check docs sync (R7)
        entry: uv run --frozen python tools/check_docs_sync.py --commit-msg
        language: system
        stages: [commit-msg]
        always_run: true

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets (full history)
        entry: gitleaks git --redact --verbose
        stages: [manual]
