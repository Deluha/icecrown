[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "icecrown"
version = "0.1.0.dev0"
description = "Snapshot testing for tabular data: freeze a dataset's fingerprint, verify it in CI, see what moved."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "The Project Icecrown authors" }]
keywords = ["snapshot-testing", "data-testing", "arrow", "fingerprint", "pytest", "data-pipeline"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Testing",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = ["pyarrow>=18.0.0"]

[project.optional-dependencies]
pandas = ["pandas>=2.2.2"]
sql = ["sqlalchemy>=2.0"]

[project.urls]
Homepage = "https://github.com/Deluha/icecrown"
Source = "https://github.com/Deluha/icecrown"
Issues = "https://github.com/Deluha/icecrown/issues"
Changelog = "https://github.com/Deluha/icecrown/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=9.0",
    "hypothesis>=6.150",
    "coverage[toml]>=7.10",
    "pytest-socket>=0.7",
]
lint = [
    "ruff>=0.17",
    "mypy>=2.4",
    "pre-commit>=4.3",
]
docs = [
    "sphinx>=9.2; python_full_version >= '3.13'",
    "myst-parser>=5.0; python_full_version >= '3.13'",
    "sphinx-autoapi>=3.9; python_full_version >= '3.13'",
    "furo>=2025.12.19; python_full_version >= '3.13'",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.uv]
default-groups = ["dev"]
required-version = ">=0.13"

[tool.hatch.build.targets.wheel]
packages = ["src/icecrown"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.claude",
    "/tools",
    "/evals",
    "/.github",
    "/uv.lock",
    "/.pre-commit-config.yaml",
    "/.gitleaks.toml",
]
